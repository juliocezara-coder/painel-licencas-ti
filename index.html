:root,:root[data-theme="light"],:root[data-theme="dark"]{--bg:#121a1a;--surface:#1a2424;--ink:#e6eeec;--muted:#9fb0ad;--line:#2f3d3c;--accent:#4fb3b0;--accent-ink:#0c1717;--ok:#6fcf97;--warn:#e8b84a;--bad:#ff8a80;--okbg:#1c3327;--warnbg:#3a2f12;--badbg:#3d1e1b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1a;--surface:#1a2424;--ink:#e6eeec;--muted:#9fb0ad;--line:#2f3d3c;--accent:#4fb3b0;--accent-ink:#0c1717;--ok:#6fcf97;--warn:#e8b84a;--bad:#ff8a80;--okbg:#1c3327;--warnbg:#3a2f12;--badbg:#3d1e1b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a1a;--surface:#1a2424;--ink:#e6eeec;--muted:#9fb0ad;--line:#2f3d3c;--accent:#4fb3b0;--accent-ink:#0c1717;--ok:#6fcf97;--warn:#e8b84a;--bad:#ff8a80;--okbg:#1c3327;--warnbg:#3a2f12;--badbg:#3d1e1b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:1320px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:26px;margin:0;font-weight:600;letter-spacing:-.01em}
h3{font-size:15px;margin:18px 0 8px}
p.sub{margin:2px 0 0;color:var(--muted)}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.sm{padding:4px 9px;font-size:13px}
td .btn.sm{margin:2px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brand{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.logo img{height:44px;width:auto;display:block}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.role{padding:2px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.role.operador{background:var(--warnbg);color:var(--warn)}.role.leitor{background:var(--line);color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.kpi b{display:block;font-size:24px;font-weight:600}
.kpi span{color:var(--muted);font-size:13px}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:20px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.chart h3{margin:0 0 10px;font-size:14px}
.dn{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:4px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.hr{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:8px;align-items:center;margin-bottom:6px;font-size:13px}
.hn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar{display:flex;height:14px;background:var(--line);border-radius:3px;overflow:hidden}
.hbar span{display:block;height:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.bar input,.bar select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.bar input[type=search]{flex:1;min-width:180px}
#msg{margin-bottom:12px;padding:10px 12px;border-radius:6px;background:var(--warnbg);color:var(--warn)}
.wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:0}
th,td{text-align:left;padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
.acc th,.acc td{white-space:normal;cursor:default}
th{font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.tag{white-space:nowrap;display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:500}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}
.meter{height:6px;background:var(--line);border-radius:3px;margin:4px 0 0 auto;width:90px}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.meter i.over{background:var(--bad)}
.empty{padding:32px;text-align:center;color:var(--muted)}
#gate,#wl{max-width:460px;margin:12vh auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:28px;text-align:center}
#gate h1,#wl h1{font-size:22px;margin-bottom:8px}
dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:20px;width:min(640px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 4px;font-size:19px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted)}
.grid label.full{grid-column:1/-1}
.grid input,.grid select,.inl input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--ink)}
.inl{display:flex;flex-wrap:wrap;gap:8px}.inl input{flex:1;min-width:130px}
.inl select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;color:var(--ink);max-width:100%}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
ul.l{list-style:none;margin:0 0 8px;padding:0}
ul.l li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
ul.l small{color:var(--muted)}
ul.l input,textarea{font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:var(--ink)}
textarea{width:100%;padding:8px}
@media (max-width:520px){.grid{grid-template-columns:1fr}}

.aviso{margin:0 0 16px;padding:10px 12px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13px}

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fd(s){return s?s.split("-").reverse().join("/"):"Sem vencimento"}

function seats(l){var r={v:0,ok:0,prox:0,list:[]};
 l.alocs.forEach(function(a){var s=seatV(a,l),n=s?Math.round((new Date(s+"T00:00:00")-today)/864e5):null,venc=n!==null&&n<0;
  if(venc)r.v++;else{r.ok++;if(n!==null&&n<=90)r.prox++}

function status(l){var dd=null,s=seats(l),na=l.alocs.length;
